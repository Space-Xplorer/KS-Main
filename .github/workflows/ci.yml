name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typecheck needs Next's generated route types (LayoutProps and friends),
      # which only exist after typegen. Without this, tsc fails in CI while
      # passing locally, because local runs have a .next directory already.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Core is pure TypeScript, so the suite needs no database and no browser.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders. src/lib/env.ts validates shape at import,
          # and a Next build imports client modules. These are not secrets and
          # are never used to reach a real project.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
